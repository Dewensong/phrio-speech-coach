name: Phrio public macOS release candidate

on:
  workflow_dispatch:
    inputs:
      evidence_label:
        description: Human-readable label included in the artifact name
        required: true
        default: 0.1.0-alpha.0-candidate
        type: string

permissions:
  contents: read

concurrency:
  group: phrio-public-release-candidate
  cancel-in-progress: false

jobs:
  build-notarized-candidate:
    name: build-notarized-candidate
    runs-on: macos-15
    timeout-minutes: 60
    environment: macos-release-candidate
    env:
      CI: "1"
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Confirm main source and evidence label
        shell: bash
        env:
          EVIDENCE_LABEL: ${{ inputs.evidence_label }}
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          if [[ ! "${EVIDENCE_LABEL}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "::error::Evidence label must use 1-64 letters, digits, dots, underscores, or hyphens."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.33.2
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run automated production gate
        run: pnpm verify

      - name: Confirm required release credentials
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          required=(
            APPLE_CERTIFICATE_P12
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_API_KEY_P8
            APPLE_API_KEY_ID
            APPLE_API_ISSUER
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              exit 1
            fi
          done

      - name: Import Developer ID identity
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          CERTIFICATE_PATH="${RUNNER_TEMP}/phrio-developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/phrio-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "${APPLE_CERTIFICATE_P12}" | /usr/bin/base64 -D > "${CERTIFICATE_PATH}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          rm -f "${CERTIFICATE_PATH}"
          echo "PHRIO_RELEASE_KEYCHAIN=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          umask 077
          APPLE_API_KEY="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" | /usr/bin/base64 -D > "${APPLE_API_KEY}"
          chmod 600 "${APPLE_API_KEY}"
          echo "APPLE_API_KEY=${APPLE_API_KEY}" >> "${GITHUB_ENV}"

      - name: Build Developer ID signed and app-notarized artifacts
        env:
          PHRIO_RELEASE_SIGNING: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm make

      - name: Notarize and staple DMG container
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG_PATH="$(find out/make -type f -name '*.dmg' -print -quit)"
          if [[ -z "${DMG_PATH}" ]]; then
            echo "::error::No DMG was produced."
            exit 1
          fi
          xcrun notarytool submit "${DMG_PATH}" \
            --key "${APPLE_API_KEY}" \
            --key-id "${APPLE_API_KEY_ID}" \
            --issuer "${APPLE_API_ISSUER}" \
            --wait
          xcrun stapler staple "${DMG_PATH}"

      - name: Verify public release boundary and checksums
        run: pnpm verify:release-candidate

      - name: Upload notarized release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Phrio-${{ inputs.evidence_label }}-${{ github.sha }}-macOS-arm64-notarized
          path: |
            out/make/**/*.dmg
            out/make/**/*.zip
            out/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${PHRIO_RELEASE_KEYCHAIN:-}" ]]; then
            security delete-keychain "${PHRIO_RELEASE_KEYCHAIN}" || true
          fi
          if [[ -n "${APPLE_API_KEY:-}" ]]; then
            rm -f "${APPLE_API_KEY}"
          fi
